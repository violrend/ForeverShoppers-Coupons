<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForeverShoppers Coupons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      padding: 16px 18px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      font-size: 22px;
    }
    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .header-text p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 1px;
    }
    .refresh-btn {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.3); }

    /* Search */
    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid #f0ecfa;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #e0d7f5;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: #7c3aed; }

    /* Tab bar */
    .tabs {
      display: flex;
      border-bottom: 1px solid #f0ecfa;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #7c3aed;
      border-bottom-color: #7c3aed;
    }

    /* Store badge */
    .current-store {
      background: #f5f0ff;
      padding: 8px 14px;
      font-size: 12px;
      color: #7c3aed;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .store-dot { width: 7px; height: 7px; background: #7c3aed; border-radius: 50%; }
    .no-store { background: #f9fafb; color: #aaa; }

    /* Coupon list */
    .coupon-list {
      max-height: 340px;
      overflow-y: auto;
    }
    .coupon-item {
      padding: 12px 14px;
      border-bottom: 1px solid #f5f0ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coupon-item:last-child { border-bottom: none; }
    .coupon-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: contain;
      background: #f5f0ff;
      flex-shrink: 0;
    }
    .coupon-logo-placeholder {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed22, #a855f722);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .coupon-info { flex: 1; min-width: 0; }
    .coupon-store {
      font-size: 11px;
      color: #888;
      margin-bottom: 1px;
    }
    .coupon-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coupon-code-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .coupon-code {
      font-family: monospace;
      font-size: 12px;
      background: #f0ecfa;
      color: #7c3aed;
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .copy-btn {
      font-size: 11px;
      color: #7c3aed;
      background: none;
      border: 1px solid #c4b5fd;
      border-radius: 5px;
      padding: 2px 7px;
      cursor: pointer;
      font-weight: 500;
    }
    .copy-btn:hover { background: #f0ecfa; }
    .copy-btn.copied { color: #16a34a; border-color: #16a34a; }
    .shop-link {
      font-size: 11px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 500;
      flex-shrink: 0;
    }
    .shop-link:hover { text-decoration: underline; }

    /* Empty / loading */
    .state-msg {
      padding: 32px 20px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
    }
    .state-msg .icon { font-size: 32px; margin-bottom: 8px; }

    /* Footer */
    .footer {
      padding: 10px 14px;
      border-top: 1px solid #f0ecfa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-count { font-size: 11px; color: #aaa; }
    .footer a {
      font-size: 12px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #e0d7f5;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">🛍️</div>
  <div class="header-text">
    <h1>ForeverShoppers Coupons</h1>
    <p>Save money on every purchase</p>
  </div>
  <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search stores or coupons..." />
</div>

<div class="tabs">
  <div class="tab active" data-tab="this-site">This Site</div>
  <div class="tab" data-tab="all">All Coupons</div>
</div>

<div id="currentStoreBar" class="current-store no-store">
  <div class="store-dot"></div>
  <span id="currentStoreLabel">Loading current site...</span>
</div>

<div class="coupon-list" id="couponList">
  <div class="state-msg">
    <div class="spinner"></div>
    <p style="margin-top:10px;">Loading coupons...</p>
  </div>
</div>

<div class="footer">
  <span class="footer-count" id="footerCount"></span>
  <a href="https://forevershoppers.com" target="_blank">Visit ForeverShoppers →</a>
</div>

<script src="popup.js"></script>
</body>
</html>
